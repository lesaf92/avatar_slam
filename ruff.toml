# Single ruff configuration for all Python in the repository (AGENTS.md §7).
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode (σ, ψ in docstrings are intentional)
    "RUF002",
    "RUF003",
]

[lint.isort]
known-first-party = ["avatar"]

[lint.per-file-ignores]
# Entry points pin BLAS threads before importing NumPy (see the comment there).
"experiments/*.py" = ["E402"]
"avatar_py/avatar/cli.py" = ["E402"]
"avatar_py/tests/conftest.py" = ["E402"]
