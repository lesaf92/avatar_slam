# Feature-poor transit (H1): uuv_1 leaves the piers, crosses the sparse outer
# mooring field, returns along the pipeline and ends back among the piles, one
# way (no self-revisits). uuv_0 surveys the outer field, so the team knows the
# landmarks uuv_1 passes but uuv_1 alone sees each of them only once.
scenario: harbor_fleet
duration_s: 600
args:
  acoustic: m64
  n_uuv: 2
  paths:
    uuv_0: {kind: lawnmower, start: [70, -30], z: -4.0, length: 30, width: 70, spacing: 14, speed_mps: 0.5}
    uuv_1: {kind: polyline, start: [12, 42], z: -5.0, speed_mps: 0.5, loop: false,
            points: [[0, 0], [88, 0], [88, -72], [3, -72], [3, -42]]}
