[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-slam"
version = "0.1.0"
description = "Avatar SLAM reference implementation: decentralized SLAM for air-ground-surface-underwater robot teams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Avatar SLAM contributors" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.8"]

[project.scripts]
avatar = "avatar.cli:main"

[tool.setuptools.packages.find]
include = ["avatar*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode (σ, ψ in docstrings are intentional)
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
